# 99-hardening.conf — drop-in SSH hardening
# Installed to /etc/ssh/sshd_config.d/99-hardening.conf
# Ubuntu/Debian include /etc/ssh/sshd_config.d/*.conf from the top of sshd_config.
# NOTE: sshd uses the FIRST value found for a keyword, so file names matter.
#       50-cloud-init.conf already sets PasswordAuthentication no on most cloud
#       images; this file makes the intent explicit and adds the rest.

# --- Authentication ---
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
AuthenticationMethods publickey

# --- Reduce attack surface ---
# NOTE: TCP forwarding is intentionally left enabled so that `herdr --remote`
# and similar tools keep working. Enable only if you know you don't need it:
#   AllowTcpForwarding no
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
MaxAuthTries 3
MaxSessions 10
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2

# --- Restrict who may log in (edit or remove if you have more admins) ---
AllowUsers ubuntu
